<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_label }} — {{ config.get('ui', {}).get('app_title', 'Pictotem') }}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('custom_fonts_css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin-blocks.css') }}">
  <script src="{{ url_for('static', filename='admin-blocks.js') }}" defer></script>
  <style>
    .admin-wrap  { max-width: 740px; margin: 0 auto; padding: 40px 20px 60px; }
    .back-link   { display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
                   text-decoration: none; font-size: 14px; margin-bottom: 28px; }
    .back-link:hover { color: var(--text); }
    h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 32px; }
    .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 24px; font-size: 14px; }
    .alert-ok  { background: rgba(50,200,100,.15); border:1px solid rgba(50,200,100,.3); color:#4ecca0; }
    .alert-err { background: rgba(200,50,50,.15);  border:1px solid rgba(200,50,50,.3);  color:#e57373; }
    .text-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
                    padding: 24px; margin-bottom: 24px; }
    .text-section h2 { font-size: 17px; font-weight: 700; margin: 0 0 18px; }
  </style>
</head>
<body class="gallery-body" data-admin-page="votes">
<div class="admin-wrap">

  <a class="back-link" href="{{ url_for('admin_home') }}">← Administration</a>
  <h1>{{ page_label }}</h1>
  <p class="subtitle">Paramètres du vote affiché dans la galerie publique.</p>

  {% if alert_success %}<div class="alert alert-ok">{{ alert_success }}</div>{% endif %}
  {% if alert_error   %}<div class="alert alert-err">{{ alert_error }}</div>{% endif %}

  {% for block in blocks %}
  <div class="text-section{% if block.variant %} {{ block.variant }}{% endif %}{% if block.collapsed %} block-collapsed{% endif %}" data-block-id="{{ block.id }}">
    <div class="block-header-row">
      <span class="block-drag-handle" title="Glisser pour réordonner">⠿</span>
      <h2>{{ block.title }}</h2>
      <button type="button" class="block-collapse-toggle" aria-label="Replier / déplier">▾</button>
    </div>
    <div class="admin-block-body">
      {% include block.template %}
    </div>
    <form method="post" action="{{ url_for('admin_move_block') }}" class="block-move-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="block_id" value="{{ block.id }}">
      <label>Déplacer vers</label>
      <select name="target_page">
        {% for slug, label, _ep in admin_pages %}
        <option value="{{ slug }}" {% if slug == current_page %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
      <button type="submit">Déplacer</button>
    </form>
  </div>
  {% endfor %}

</div>
</body>
</html>
