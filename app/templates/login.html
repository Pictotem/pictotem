<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-main">
    <section class="login-card">
      <h1>{{ title }}</h1>
      <p class="login-text">{{ subtitle }}</p>
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <form class="login-form" method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autofocus required>
        <button class="action-btn primary" type="submit">Se connecter</button>
      </form>
      <p class="login-link"><a href="{{ url_for('index') }}">Retour à l’accueil</a></p>
    </section>
  </main>
</body>
</html>
