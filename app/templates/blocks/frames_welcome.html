<div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;">
  <div style="flex:0 0 auto;">
    {% if welcome_frame_url %}
    <div style="width:240px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#0d0f11;">
      <img src="{{ welcome_frame_url }}" style="width:100%;height:100%;object-fit:cover;" alt="Cadre d'accueil">
    </div>
    {% else %}
    <div style="width:240px;aspect-ratio:16/9;border-radius:10px;border:1px dashed var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;">
      Aucun cadre configuré
    </div>
    {% endif %}
  </div>
  <div style="flex:1;min-width:220px;">
    <p style="color:var(--muted);font-size:13px;margin:0 0 16px;">
      Ce cadre s'affiche en superposition du stream sur l'écran d'accueil pour attirer l'attention des visiteurs.
      Il n'apparaît pas dans le sélecteur de cadres de la capture.
    </p>
    <form method="post" action="{{ url_for('admin_welcome_frame_upload') }}" enctype="multipart/form-data" style="margin-bottom:10px;">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <div class="file-field" style="flex:1;">
          <label class="field-label">PNG avec transparence (fond transparent)</label>
          <input type="file" name="welcome_frame" accept=".png">
        </div>
      </div>
      <button type="submit" class="action-btn small primary">Mettre à jour</button>
    </form>
    {% if welcome_frame_url %}
    <form method="post" action="{{ url_for('admin_welcome_frame_remove') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="action-btn small danger"
              onclick="return confirm('Supprimer le cadre d\'accueil ?')">Supprimer</button>
    </form>
    {% endif %}
  </div>
</div>
