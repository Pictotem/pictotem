<div class="form-card">

  <!-- Pause à distance (nouveau) : bascule le même réglage que le bouton
       pause du kiosque lui-même (voir #pauseBtn, bestof.html) -- les deux
       se resynchronisent automatiquement entre eux (sondage 15s côté
       kiosque, voir admin_slideshow_toggle_pause/api_bestof_set_pause,
       app.py). Formulaire séparé du reste des paramètres ci-dessous :
       action immédiate, pas un réglage à "enregistrer". -->
  <div class="promo-live-control">
    <span class="promo-live-status{% if slideshow_settings.paused %} is-paused{% endif %}">
      {% if slideshow_settings.paused %}⏸ En pause{% else %}▶ En lecture{% endif %}
    </span>
    <form method="post" action="{{ url_for('admin_slideshow_toggle_pause') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="btn-primary" type="submit">
        {% if slideshow_settings.paused %}▶ Reprendre le diaporama{% else %}⏸ Mettre le diaporama en pause{% endif %}
      </button>
    </form>
    <a class="preview-link" href="{{ url_for('bestof') }}" target="_blank">↗ Voir le slideshow</a>
  </div>

  <!-- Affichage forcé hors cycle (nouveau) : montre IMMÉDIATEMENT une page
       promo choisie, pour une durée donnée, en interrompant le cycle en
       cours -- puis reprend ce cycle tout seul une fois la durée écoulée
       (voir showForcedPromo/endForcedPromo, bestof.html, et
       admin_promo_force_start/admin_promo_force_stop, app.py). Juste sous
       le contrôle pause ci-dessus, à sa demande. `promo_pages` vient du
       contexte global de la page (voir admin_slideshow(), app.py), pas de
       ce bloc -- déjà utilisé plus bas par les cartes de pages promo. -->
  <div class="promo-live-control promo-force-control">
    {% if forced_promo %}
    <span class="promo-live-status is-forced">
      ⏵ Page #{{ forced_promo.page.id }} forcée — encore {{ (forced_promo.remaining_ms / 1000) | round(0, 'ceil') | int }}s
    </span>
    <form method="post" action="{{ url_for('admin_promo_force_stop') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="btn-danger" type="submit">✕ Désactiver</button>
    </form>
    {% else %}
    <form method="post" action="{{ url_for('admin_promo_force_start') }}" class="promo-force-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label style="font-size:13px;font-weight:600;color:var(--muted)">Afficher hors cycle</label>
      <select name="page_id" {% if not promo_pages %}disabled{% endif %}>
        {% if not promo_pages %}
        <option value="">Aucune page promo</option>
        {% endif %}
        {% for p in promo_pages %}
        <option value="{{ p.id }}">Page #{{ p.id }}{% if not p.active %} (inactive){% endif %}</option>
        {% endfor %}
      </select>
      <span style="font-size:13px;color:var(--muted)">pendant</span>
      <input type="number" name="duration_seconds" min="1" max="600" value="15" style="max-width:90px">
      <span style="font-size:13px;color:var(--muted)">s</span>
      <button class="btn-primary" type="submit" {% if not promo_pages %}disabled{% endif %}>▶ Activer</button>
    </form>
    {% endif %}
  </div>

  <form method="post" action="{{ url_for('admin_slideshow_set_settings') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label>Type de média</label>
      <div class="radio-group">
        <label><input type="radio" name="type" value="both"
          {% if slideshow_settings.type == 'both' %}checked{% endif %}> Photos &amp; vidéos</label>
        <label><input type="radio" name="type" value="photo"
          {% if slideshow_settings.type == 'photo' %}checked{% endif %}> Photos uniquement</label>
        <label><input type="radio" name="type" value="video"
          {% if slideshow_settings.type == 'video' %}checked{% endif %}> Vidéos uniquement</label>
      </div>
    </div>

    <div class="field-row">
      <div class="field field-half">
        <label>Délai entre chaque slide (secondes, pour les photos)</label>
        <input type="number" name="delay" min="1" max="300"
               value="{{ slideshow_settings.delay }}" style="max-width:140px">
      </div>
      <div class="field field-half">
        <label>Ordre de diffusion</label>
        <div class="radio-group">
          <label><input type="radio" name="order" value="chrono"
            {% if slideshow_settings.order == 'chrono' %}checked{% endif %}> Chronologique</label>
          <label><input type="radio" name="order" value="random"
            {% if slideshow_settings.order == 'random' %}checked{% endif %}> Aléatoire</label>
          <label><input type="radio" name="order" value="votes_desc"
            {% if slideshow_settings.order == 'votes_desc' %}checked{% endif %}> Votes ↓ (plus positif d'abord)</label>
          <label><input type="radio" name="order" value="votes_asc"
            {% if slideshow_settings.order == 'votes_asc' %}checked{% endif %}> Votes ↑ (plus négatif d'abord)</label>
        </div>
      </div>
    </div>

    <div class="field-row">
      <div class="field field-half">
        <label>Depuis le (date la plus ancienne — vide = pas de limite)</label>
        <input type="date" name="date_from" value="{{ slideshow_settings.date_from[:10] if slideshow_settings.date_from else '' }}">
      </div>
      <div class="field field-half">
        <label>Jusqu'au (date la plus récente — vide = pas de limite)</label>
        <input type="date" name="date_to" value="{{ slideshow_settings.date_to[:10] if slideshow_settings.date_to else '' }}">
      </div>
    </div>

    <div class="field-row">
      <div class="field field-half">
        <label>Vote minimum (≥ N — vide = pas de limite)</label>
        <input type="number" name="vote_min" min="-9999" max="9999"
               value="{{ slideshow_settings.vote_min }}" style="max-width:120px"
               placeholder="ex : 1">
      </div>
      <div class="field field-half">
        <label>Vote maximum (≤ N — vide = pas de limite)</label>
        <input type="number" name="vote_max" min="-9999" max="9999"
               value="{{ slideshow_settings.vote_max }}" style="max-width:120px"
               placeholder="ex : 10">
      </div>
    </div>

    <div class="field">
      <label>Rafraîchissement automatique (secondes — 0 = désactivé)
        <span style="color:var(--muted);font-weight:400">
          Le slideshow recharge la liste des slides en arrière-plan à cet intervalle
          (nouvelles photos, votes mis à jour, seuils franchis…).
        </span>
      </label>
      <input type="number" name="refresh_interval" min="0" max="86400"
             value="{{ slideshow_settings.refresh_interval }}" style="max-width:140px">
    </div>

    <button class="btn-primary" type="submit">Enregistrer</button>
    <a class="preview-link" href="{{ url_for('bestof') }}" target="_blank">↗ Voir le slideshow</a>
  </form>
</div>
