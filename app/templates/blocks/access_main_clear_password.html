<div class="text-fields">
  <div class="text-field" style="grid-column:1/-1">
    <p class="field-default" style="margin:0 0 12px">
      Supprime le mot de passe d'accès distant à l'interface principale. Tant qu'aucun mot de passe n'est
      défini, l'accès distant est refusé (l'accès local sur la borne reste libre). Vous pourrez en redéfinir
      un ensuite depuis cette page.
    </p>
    <form method="post" action="{{ url_for('admin_clear_main_password') }}"
          onsubmit="return confirm('Supprimer le mot de passe de l\'interface principale ? L\'accès distant sera refusé.')">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="danger-btn">Supprimer le mot de passe de l'interface principale</button>
    </form>
  </div>
</div>
