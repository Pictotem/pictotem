<form method="post" action="{{ url_for('admin_gallery_set_text') }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <label class="field-label" for="gallery_text">
    Texte affiché en haut de la galerie (sous le titre)
  </label>
  <textarea id="gallery_text" name="gallery_text">{{ gallery_text }}</textarea>
  <p class="field-hint">Supporte les retours à la ligne. Laissez vide pour ne rien afficher. Emplacements disponibles : <code>{ip}</code>, <code>{port}</code>.</p>
  <button type="submit" class="action-btn primary" style="margin-top:16px">Enregistrer</button>
</form>
