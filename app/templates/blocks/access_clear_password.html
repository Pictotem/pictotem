<div class="text-fields">
  <div class="text-field" style="grid-column:1/-1">
    <p class="field-default" style="margin:0 0 12px">
      Rend le back office (y compris cette page) accessible sans aucun mot de passe. À utiliser en
      connaissance de cause — vous pourrez toujours en redéfinir un ensuite depuis cette même page.
    </p>
    <form method="post" action="{{ url_for('admin_clear_password') }}"
          onsubmit="return confirm('Supprimer la protection par mot de passe du back office ? Il deviendra accessible sans mot de passe.')">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="danger-btn">Supprimer la protection par mot de passe</button>
    </form>
  </div>
</div>
