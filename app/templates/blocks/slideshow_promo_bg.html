{% if slideshow_promo.background %}
<div class="promo-bg-preview">
  <img src="{{ url_for('static', filename='promo/' + slideshow_promo.background) }}" alt="Fond actuel">
  <div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">Fond actuel — un dégradé par défaut est utilisé si aucun fond n'est défini.</p>
    <form method="post" action="{{ url_for('admin_slideshow_promo_bg_delete') }}" onsubmit="return confirm('Supprimer le fond actuel ?')">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="btn-danger" type="submit">Supprimer le fond</button>
    </form>
  </div>
</div>
{% else %}
<p style="color:var(--muted);font-size:14px;margin-bottom:20px">Aucun fond défini — un dégradé par défaut est utilisé.</p>
{% endif %}

<form method="post" action="{{ url_for('admin_slideshow_promo_bg_upload') }}" enctype="multipart/form-data">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="upload-zone">
    <label class="upload-label" for="promo-bg-input">Choisir une image de fond…</label>
    <input type="file" id="promo-bg-input" name="background"
           accept=".png,.jpg,.jpeg,.webp"
           onchange="document.getElementById('promo-bg-name').textContent = this.files[0]?.name || ''">
    <span id="promo-bg-name"></span>
    <p class="upload-hint">PNG, JPG, WEBP — résolution recommandée : 1920×1080 (remplace le fond actuel)</p>
    <div style="margin-top:14px">
      <button class="btn-primary" type="submit">Enregistrer comme fond</button>
    </div>
  </div>
</form>
