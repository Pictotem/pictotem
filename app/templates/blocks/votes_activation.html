<form method="post" action="{{ url_for('admin_votes_set_activation') }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <div class="check-row">
      <input type="checkbox" id="enabled" name="enabled"
             {% if vote_enabled %}checked{% endif %}>
      <span>Afficher les boutons de vote sur la galerie publique</span>
    </div>
  </div>
  <button class="btn-primary" type="submit" style="margin-top:8px">Enregistrer</button>
</form>
