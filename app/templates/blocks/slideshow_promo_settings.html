<div class="form-card">
  <form method="post" action="{{ url_for('admin_slideshow_set_promo_settings') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="checkbox-field">
      <input type="checkbox" id="promo_enabled" name="promo_enabled" {% if slideshow_promo.enabled %}checked{% endif %}>
      <label for="promo_enabled">Activer la page promo dans le diaporama</label>
    </div>

    <div class="checkbox-field">
      <input type="checkbox" id="promo_overlay_enabled" name="promo_overlay_enabled" {% if slideshow_promo.overlay_enabled %}checked{% endif %}>
      <label for="promo_overlay_enabled">Assombrir le fond (recommandé pour la lisibilité du texte et du QR code)</label>
    </div>

    <div class="field">
      <label>Fréquence d'apparition (1 fois toutes les N slides)</label>
      <input type="number" name="promo_frequency" min="1" max="200"
             value="{{ slideshow_promo.frequency }}" style="max-width:140px">
    </div>

    <div class="field">
      <label>Texte affiché (une ligne = un paragraphe)</label>
      <textarea name="promo_text" rows="4">{{ slideshow_promo.text }}</textarea>
    </div>

    <div class="field-row">
      <div class="field field-half">
        <label>Taille du texte (px)</label>
        <input type="number" name="promo_text_size" min="10" max="120"
               value="{{ slideshow_promo.text_size }}" style="max-width:140px">
      </div>
      <div class="field field-half">
        <label>Police</label>
        <select name="promo_text_font">
          {% for value, label in slideshow_promo_fonts %}
          <option value="{{ value }}" {% if slideshow_promo.text_font == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field field-half">
        <label>Couleur du texte</label>
        <input type="color" name="promo_text_color" value="{{ slideshow_promo.text_color }}">
      </div>
      <div class="field field-half">
        <label>Taille du QR code (px)</label>
        <input type="number" name="promo_qr_size" min="60" max="800"
               value="{{ slideshow_promo.qr_size }}" style="max-width:140px">
      </div>
    </div>

    <button class="btn-primary" type="submit">Enregistrer</button>
    <a class="preview-link" href="{{ url_for('bestof') }}" target="_blank">↗ Voir le slideshow</a>
  </form>
</div>
