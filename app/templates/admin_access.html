<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_label }} — {{ config.get('ui', {}).get('app_title', 'Pictotem') }}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('custom_fonts_css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin-blocks.css') }}">
  <script src="{{ url_for('static', filename='admin-blocks.js') }}" defer></script>
  <style>
    .admin-wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }
    .admin-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 36px; flex-wrap: wrap; }
    .admin-header h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
    .admin-header p { color: var(--muted); margin: 0; }
    .admin-nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .flash-list { list-style: none; padding: 0; margin: 0 0 24px; }
    .flash-list li { padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; font-weight: 600; }
    .flash-list li.success { background: rgba(13,139,143,.18); border: 1px solid rgba(13,139,143,.4); color: #5cf5f9; }
    .flash-list li.error   { background: rgba(200,50,50,.18); border: 1px solid rgba(200,50,50,.4); color: #f97b7b; }
    .text-section { margin-bottom: 36px; }
    .text-section h2 { font-size: 16px; font-weight: 700; color: var(--muted); text-transform: uppercase;
                       letter-spacing: .07em; margin: 0 0 14px; padding-bottom: 10px;
                       border-bottom: 1px solid var(--border); }
    .text-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .text-field { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .field-default { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 5px; }
    .status-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
                   padding: 8px 14px; border-radius: 999px; margin-bottom: 14px; }
    .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-pill.protected { background: rgba(50,200,100,.15); border: 1px solid rgba(50,200,100,.3); color: #4ecca0; }
    .status-pill.protected .dot { background: #4ecca0; }
    .status-pill.open { background: rgba(229,185,92,.15); border: 1px solid rgba(229,185,92,.35); color: #e5b95c; }
    .status-pill.open .dot { background: #e5b95c; }
    .pw-form { display: flex; flex-direction: column; gap: 12px; max-width: 340px; }
    .pw-form label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .pw-form input[type=password] {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 10px 12px; font-size: 14px;
    }
    .danger-btn { background: rgba(200,50,50,.12); border: 1px solid rgba(200,50,50,.4); color: #f97b7b;
                 border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .danger-btn:hover { background: rgba(200,50,50,.22); }
  </style>
</head>
<body class="gallery-body" data-admin-page="access">
<div class="admin-wrap">

  <div class="admin-header">
    <div>
      <h1>{{ page_label }}</h1>
      <p>Mot de passe d'accès au back office.</p>
    </div>
    <nav class="admin-nav">
      <a class="action-btn" href="{{ url_for('admin_home') }}">← Admin</a>
      <a class="action-btn" href="{{ url_for('logout') }}">Déconnexion</a>
    </nav>
  </div>

  {% if alert_success %}<ul class="flash-list"><li class="success">{{ alert_success }}</li></ul>{% endif %}
  {% if alert_error   %}<ul class="flash-list"><li class="error">{{ alert_error }}</li></ul>{% endif %}

  {% for block in blocks %}
  <div class="text-section{% if block.variant %} {{ block.variant }}{% endif %}{% if block.collapsed %} block-collapsed{% endif %}" data-block-id="{{ block.id }}">
    <div class="block-header-row">
      <span class="block-drag-handle" title="Glisser pour réordonner">⠿</span>
      <h2>{{ block.title }}</h2>
      <button type="button" class="block-collapse-toggle" aria-label="Replier / déplier">▾</button>
    </div>
    <div class="admin-block-body">
      {% include block.template %}
    </div>
    <form method="post" action="{{ url_for('admin_move_block') }}" class="block-move-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="block_id" value="{{ block.id }}">
      <label>Déplacer vers</label>
      <select name="target_page">
        {% for slug, label, _ep in admin_pages %}
        <option value="{{ slug }}" {% if slug == current_page %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
      <button type="submit">Déplacer</button>
    </form>
  </div>
  {% endfor %}

</div>
</body>
</html>
