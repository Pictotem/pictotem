<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Of — {{ config.get('ui', {}).get('app_title', 'Pictotem') }}</title>
  <link rel="stylesheet" href="{{ url_for('custom_fonts_css') }}">
  <!-- v2.0.9 : styles de contenu CKEditor 5 (tableaux/images/légendes tels
       que produits par l'éditeur des pages promo, voir static/promo-editor.js
       et static/ckeditor5/ -- vendorisé en local, cible la classe .ck-content
       ci-dessous, voir buildPromoContent()) -- fichier officiel CKEditor,
       pensé pour être appliqué tel quel à du contenu HORS de l'éditeur. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='ckeditor5/ckeditor5-content.css') }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #slideshow { position: relative; width: 100%; height: 100%; }
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.8s ease;
    }
    .slide.active { opacity: 1; }
    /* Classe explicite (plutôt qu'un sélecteur .slide img/video global) pour
       ne cibler que les vraies photos/vidéos — sinon cette règle, plus
       spécifique que .promo-bg/.promo-qr-card img, les écrase aussi et casse
       la mise en page de la slide promo (voir buildPromoContent ci-dessous). */
    .slide-media { width: 100%; height: 100%; object-fit: contain; display: block; }
    video.slide-media { background: #000; }
    #empty {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      color: #555; font-family: sans-serif; font-size: 18px;
    }
    /* Picto "Invité" : signale une photo envoyée par un visiteur (non
       officielle), coin bas-gauche, ne recouvre jamais le média. */
    #slideBadge {
      position: absolute; bottom: 24px; left: 24px; z-index: 5;
      background: rgba(0,0,0,.6); color: #fff; font-family: sans-serif;
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; padding: 6px 14px; border-radius: 999px;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.15);
    }
    #slideBadge.hidden { display: none; }
    /* Badge ID média (voir /admin/tags → media_id.show_on_bestof), coin
       bas-droit — ne recouvre jamais le média, ne gêne pas #slideBadge. */
    #slideMediaId {
      position: absolute; bottom: 24px; right: 24px; z-index: 5;
      background: rgba(0,0,0,.6); color: #fff; font-family: monospace;
      font-size: 14px; font-weight: 700; letter-spacing: .04em;
      padding: 6px 14px; border-radius: 999px;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.15);
    }
    #slideMediaId.hidden { display: none; }
    /* Tags du média (voir /admin/tags → Affichage sur /bestof), coin
       haut-gauche — police/fond/couleur/taille pilotés par tagsStyle (JS),
       réglables depuis l'admin. */
    #slideTags {
      position: absolute; top: 24px; left: 24px; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 8px; max-width: 65%;
    }
    #slideTags.hidden { display: none; }
    .slide-tag-chip {
      display: inline-block; padding: 6px 16px; border-radius: 999px;
      font-weight: 700; backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,.15);
    }

    /* Bouton pause : fige le diaporama sur la slide en cours (voir
       pauseSlideshow/resumeSlideshow ci-dessous) -- coin haut-droit, seul
       coin encore libre (bas-gauche = #slideBadge, bas-droit = #slideMediaId,
       haut-gauche = #slideTags). Masqué par défaut (opacity), réapparaît au
       moindre mouvement de souris/tactile (voir showControls()) et reste
       affiché tant que le diaporama est en pause -- sinon impossible de le
       retrouver pour reprendre la lecture. */
    #pauseBtn {
      position: absolute; top: 24px; right: 24px; z-index: 10;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.2);
      color: #fff; font-size: 17px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s ease;
    }
    #pauseBtn.visible { opacity: 1; }
    #pauseBtn:hover { background: rgba(0,0,0,.75); }
    #pauseBtn.is-paused { border-color: rgba(255,255,255,.4); }

    /* Pages promo (fond + QR + texte WYSIWYG) — voir /admin/slideshow →
       Pages promo. Plusieurs pages actives tournent en rotation, chacune
       avec sa propre fréquence, son temps de pause et son effet visuel
       (classes .effect-* ci-dessous) — voir buildPromoContent(). */
    .slide.slide-promo { display: block; }
    .promo-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    .promo-overlay { position: absolute; inset: 0; z-index: 1; background: rgba(0,0,0,.42); }
    /* Doit rester au-dessus de .promo-overlay (texte + QR toujours visibles,
       jamais recouverts par le voile d'assombrissement du fond). Le padding
       (marges avec les bords de l'écran) n'est PAS fixé ici -- posé en style
       inline par page, un côté à la fois (voir buildPromoContent() ->
       page.content_padding_top/right/bottom/left, /admin/slideshow -> Pages
       promo), 60px par défaut par côté si absent. */
    .promo-content {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 36px; text-align: center; box-sizing: border-box;
    }
    /* QR en position "coin" (voir .promo-qr-pos-* plus bas) : le QR sort du
       flux de .promo-content, qui n'a alors plus que le texte à centrer. */
    /* v2.0.4 : plus de champs "Taille du texte"/"Police"/"Couleur du texte"
       indépendants (voir /admin/slideshow) -- ces valeurs par défaut ne
       s'appliquent que là où le WYSIWYG n'a rien précisé pour un passage de
       texte donné (un span avec sa propre police/taille/couleur, posée
       depuis la barre d'outils, l'emporte naturellement via la cascade
       CSS). Mêmes valeurs que l'ancien défaut ('Par défaut (Segoe UI)',
       28px, blanc) -- aucun changement visuel pour les pages existantes. */
    .promo-text { max-width: 900px; font-family: system-ui, "Segoe UI", sans-serif; font-size: 28px; color: #ffffff; }
    .promo-text p { margin: 0 0 16px; line-height: 1.4; }
    .promo-text p:last-child { margin-bottom: 0; }
    .promo-text ul, .promo-text ol { text-align: left; display: inline-block; margin: 0 0 16px; }
    /* Tableau inséré depuis le WYSIWYG CKEditor 5 (voir static/promo-editor.js
       + ckeditor5-content.css, chargé dans <head> ci-dessus) : par défaut,
       ckeditor5-content.css affiche une bordure visible ("1px double") même
       sans bordure explicitement posée par l'admin -- annulée ici pour
       rester cohérente avec le comportement précédent (aucun style de
       tableau tant que l'admin n'en a pas ajouté un depuis le panneau
       "Propriétés du tableau"). Un style en ligne posé par l'admin
       (bordure, padding, largeur...) reste toujours prioritaire (style en
       ligne > cette feuille de style, quelle que soit la spécificité). */
    .promo-text.ck-content table.table:not(.layout-table),
    .promo-text.ck-content figure.table:not(.layout-table) > table,
    .promo-text.ck-content table.table:not(.layout-table) > * > tr > td,
    .promo-text.ck-content table.table:not(.layout-table) > * > tr > th {
      border: none; background: transparent;
    }
    /* Rétro-compatibilité : pages enregistrées avec l'ancien éditeur (Quill,
       avant v2.0.9) -- <table> "nu" sans le <figure class="table"> ajouté
       par CKEditor, cellules avec de vrais retours à la ligne \n tapés
       DANS la cellule (contenteditable natif de l'ancien système) plutôt
       que des <p> imbriqués. Reste nécessaire tant que l'admin n'a pas
       rouvert+réenregistré ces pages avec le nouvel éditeur. */
    .promo-text table { border-collapse: collapse; margin: 0 auto 16px; }
    .promo-text td, .promo-text th { padding: 6px 10px; white-space: pre-wrap; }
    /* Image alignée/redimensionnée depuis le WYSIWYG (voir
       static/promo-editor.js) : max-width en filet de sécurité si jamais la
       largeur enregistrée dépassait le conteneur ; clearfix pour que
       .promo-text ne s'effondre pas quand tout son contenu est flottant. */
    /* QR code(s) inline : simples <img class="promo-inline-qr"> insérés dans
       le texte via la balise {qrcode=...} (voir _resolve_inline_qrcodes,
       app.py), rendu directement dans le flux de .promo-text comme n'importe
       quelle autre image -- plus de conteneur/positionnement dédié. */
    .promo-inline-qr { background: #fff; padding: 8px; border-radius: 12px; box-shadow: 0 8px 26px rgba(0,0,0,.4); }

    /* Effets visuels (voir /admin/slideshow → Pages promo → « Effet visuel
       à l'apparition »), appliqués à .slide-promo via une classe effect-*
       posée par showNext() — indépendants du fondu-enchaîné entre slides,
       qui reste géré globalement par .slide.active (transition d'opacité).
       --promo-duration (posée par buildPromoContent(), = temps de pause de
       la page) cale la durée de l'effet kenburns sur tout le temps
       d'affichage de la slide plutôt qu'une durée fixe arbitraire. */
    @keyframes promoSlideUp { from { transform: translateY(46px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes promoZoomIn  { from { transform: scale(.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes promoBounce  { 0% { transform: translateY(-34px); opacity: 0; } 60% { transform: translateY(10px); opacity: 1; } 100% { transform: translateY(0); } }
    @keyframes promoKenburns { from { transform: scale(1); } to { transform: scale(1.09); } }

    .slide-promo.effect-slide-up .promo-content { animation: promoSlideUp .7s ease both; }
    .slide-promo.effect-zoom-in .promo-content { animation: promoZoomIn .7s ease both; }
    .slide-promo.effect-bounce .promo-content { animation: promoBounce .9s ease both; }
    .slide-promo.effect-kenburns .promo-bg {
      animation: promoKenburns var(--promo-duration, 8s) ease-in-out both;
    }

  </style>
</head>
<body>
<div id="slideshow">
  <div id="slideA" class="slide"></div>
  <div id="slideB" class="slide"></div>
  <div id="slideBadge" class="hidden">Invité</div>
  <div id="slideMediaId" class="hidden"></div>
  <div id="slideTags" class="hidden"></div>
  <button id="pauseBtn" type="button" aria-label="Mettre en pause" title="Pause (espace)">❚❚</button>
  <div id="empty" style="display:none">Aucun média à afficher.</div>
</div>

<script>
(async () => {
  let slides = [];
  let idx = 0;
  let current = 'A';
  let settings = { delay: 5, order: 'chrono', refreshInterval: 300 };
  let promoPages = [];
  let showMediaId = false;
  let showTags = false;
  let tagsStyle = { font: 'system-ui, sans-serif', bg_color: '#0d8b8f', text_color: '#ffffff', font_size: 14 };
  let cleanup = null;

  // Pause (voir #pauseBtn ci-dessous) : fige le diaporama sur la slide en
  // cours plutôt que d'essayer de calculer un temps restant précis --
  // pauseSlideshow() annule simplement le minuteur/la vidéo de la slide
  // affichée (via `cleanup`, déjà prévu pour ça), resumeSlideshow()
  // reprogramme un minuteur COMPLET (ou relance la vidéo) pour cette même
  // slide. pauseVideoEl/pauseAdvanceFn/pauseDurationMs sont posés par
  // showNext() ci-dessous, une fois par slide affichée, à côté de `cleanup`.
  let paused = false;
  let pauseVideoEl = null;    // <video> de la slide affichée, si c'en est une
  let pauseAdvanceFn = null;  // callback "passer à la slide suivante" de la slide affichée
  let pauseDurationMs = null; // durée totale (photo/promo) à reprogrammer à la reprise

  // Affichage forcé hors cycle (voir /admin/slideshow → Paramètres, juste
  // sous le contrôle pause) : interrompt le cycle normal pour montrer une
  // page promo choisie pendant une durée fixée, puis reprend ce cycle tout
  // seul. Réutilise le même mécanisme que la pause ci-dessus (`cleanup`,
  // `pauseAdvanceFn`, `pauseDurationMs`) -- une pause déclenchée PENDANT un
  // affichage forcé le fige donc comme n'importe quelle autre slide, sans
  // code supplémentaire (voir pauseSlideshow/resumeSlideshow).
  let forcedPromoActive = false;
  let forcedPromoPageId = null; // id de la page forcée actuellement affichée (ou en cours de reprise), null sinon

  // Minuteurs de fondu sortant en cours (voir showNext()/showForcedPromo()
  // ci-dessous, section « Crossfade ») -- un par slide (#slideA/#slideB),
  // gardés ICI (partagés entre les deux fonctions) pour pouvoir en annuler
  // un déjà programmé quand le MÊME élément redevient la slide active moins
  // de 800ms plus tard. Sans ça, un minuteur périmé retire .active de
  // l'élément qu'on vient tout juste de réafficher (silencieusement --
  // l'écran passe au noir), ce qui arrive dès qu'une transition survient à
  // un moment non prévisible par rapport à la précédente : c'est justement
  // le cas de l'affichage forcé hors cycle (démarre ou se termine à tout
  // instant, sans attendre la fin naturelle de la slide en cours), alors
  // qu'en cycle normal deux transitions consécutives sont toujours séparées
  // d'au moins plusieurs secondes (délai photo / pause_seconds promo) et ne
  // se chevauchent donc jamais.
  const fadeOutTimers = { A: null, B: null };

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function interleave(captures, images) {
    if (!images.length) return [...captures];
    if (!captures.length) return [...images];
    const result = [];
    const step = Math.max(1, Math.floor(captures.length / (images.length + 1)));
    let ii = 0;
    captures.forEach((c, i) => {
      result.push(c);
      if ((i + 1) % step === 0 && ii < images.length) result.push(images[ii++]);
    });
    while (ii < images.length) result.push(images[ii++]);
    return result;
  }

  // Insère une slide promo par page active, chacune à sa propre fréquence
  // (« 1 fois toutes les N slides réelles »). Plusieurs pages peuvent
  // coïncider au même point : elles sont alors insérées dans l'ordre de
  // passage (promoPages déjà trié par sort_order — voir list_promo_pages
  // côté serveur). Ne compte que les slides "réelles" (photos/vidéos/images
  // intermédiaires), jamais les slides promo elles-mêmes.
  function insertPromo(base) {
    const active = promoPages.filter((p) => p.frequency > 0);
    if (!active.length) return base;
    const result = [];
    let realCount = 0;
    base.forEach((s) => {
      result.push(s);
      realCount++;
      active.forEach((p) => {
        if (realCount % p.frequency === 0) result.push({ type: 'promo', page: p });
      });
    });
    return result;
  }

  function buildSlides(data) {
    let base;
    if (data.order === 'random') {
      base = [...data.captures, ...data.slideshow_images];
      shuffle(base);
    } else {
      // chrono, votes_desc, votes_asc : captures déjà triées côté serveur
      base = interleave(data.captures, data.slideshow_images);
    }
    const withPromo = insertPromo(base);
    // Aucun média, mais au moins une page promo active : on les diffuse
    // seules en boucle plutôt que d'afficher "Aucun média à afficher.".
    if (!withPromo.length) {
      const active = promoPages.filter((p) => p.frequency > 0);
      if (active.length) return active.map((p) => ({ type: 'promo', page: p }));
    }
    return withPromo;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function buildPromoContent(el, page) {
    el.innerHTML = '';
    el.style.setProperty('--promo-duration', (page.pause_seconds || 8) + 's');
    // Couleur derrière l'image/dégradé de fond (voir /admin/slideshow →
    // Pages promo → Fond → Couleur du fond d'écran) : posée directement sur
    // le slide lui-même, sous .promo-bg (image/dégradé, z-index 0) -- visible
    // dès que ce dernier ne couvre pas tout (transparence PNG), ou seule s'il
    // n'y a pas de fond du tout (remplace l'ancien fallback CSS fixe).
    // Défaut identique à l'ancienne couleur fixe : aucun changement visuel
    // pour les pages existantes tant que l'admin ne touche pas ce champ.
    el.style.backgroundColor = page.background_bg_color || '#14161a';

    let bg = '';
    if (page.background_kind === 'gradient' && page.background_color1) {
      const angle = page.background_angle || 135;
      const c1 = escapeHtml(page.background_color1);
      const c2 = escapeHtml(page.background_color2 || page.background_color1);
      bg = `<div class="promo-bg" style="background:linear-gradient(${angle}deg, ${c1}, ${c2})"></div>`;
    } else if (page.background_url) {
      bg = `<img class="promo-bg" src="${escapeHtml(page.background_url)}" alt="">`;
    }
    const overlay = page.overlay_enabled !== false ? `<div class="promo-overlay"></div>` : '';

    // Marges entre le bloc texte/QR et chaque bord de l'écran (voir
    // /admin/slideshow -> Pages promo -> « Marges avec les bords de l'écran »)
    // -- 60px par défaut par côté, valeur de l'ancien padding fixe unique, si
    // un réglage est absent ou invalide.
    const padTop = Number.isFinite(page.content_padding_top) ? page.content_padding_top : 60;
    const padRight = Number.isFinite(page.content_padding_right) ? page.content_padding_right : 60;
    const padBottom = Number.isFinite(page.content_padding_bottom) ? page.content_padding_bottom : 60;
    const padLeft = Number.isFinite(page.content_padding_left) ? page.content_padding_left : 60;

    // Le(s) QR code(s) éventuel(s) sont déjà résolus en <img class="promo-inline-qr">
    // à l'intérieur de page.html_content côté serveur (voir _resolve_inline_qrcodes,
    // app.py) -- plus de conteneur/positionnement dédié ici, ils suivent le
    // flux du texte comme n'importe quelle autre image insérée depuis le WYSIWYG.
    el.innerHTML = `
      ${bg}
      ${overlay}
      <div class="promo-content" style="padding:${padTop}px ${padRight}px ${padBottom}px ${padLeft}px">
        <div class="promo-text ck-content">${page.html_content || ''}</div>
      </div>
    `;

    // CSS libre par page (voir /admin/slideshow → Pages promo → « CSS libre
    // pour cette page ») : injecté via .textContent (jamais concaténé dans
    // le innerHTML ci-dessus) pour qu'aucune séquence "</style" dans le CSS
    // saisi par l'admin ne puisse casser hors de la balise <style> et
    // injecter du HTML/JS arbitraire sur /bestof. @scope sans sélecteur de
    // racine explicite prend pour racine implicite le parent de <style> —
    // ici `el` — donc les règles de l'admin ne s'appliquent jamais en
    // dehors de cette slide (silencieusement ignorées, pas de fuite
    // globale, sur un navigateur trop ancien pour @scope).
    if (page.custom_css) {
      const styleEl = document.createElement('style');
      styleEl.textContent = '@scope {\n' + page.custom_css + '\n}';
      el.appendChild(styleEl);
    }
  }

  function showNext() {
    if (!slides.length) return;
    if (cleanup) { cleanup(); cleanup = null; }

    const slide = slides[idx];
    idx++;
    if (idx >= slides.length) {
      idx = 0;
      if (settings.order === 'random') shuffle(slides);
    }

    const next = current === 'A' ? 'B' : 'A';
    const curKey = current; // capturé avant réaffectation de `current` plus bas (voir Crossfade)
    const curEl  = document.getElementById('slide' + current);
    const nextEl = document.getElementById('slide' + next);

    nextEl.className = 'slide' + (slide.type === 'promo' ? ` slide-promo effect-${slide.page.effect || 'fade'}` : '');

    let called = false;
    const advance = () => { if (!called) { called = true; showNext(); } };

    if (slide.type === 'promo') {
      buildPromoContent(nextEl, slide.page);
      const duration = (slide.page.pause_seconds || 8) * 1000;
      const t = setTimeout(advance, duration);
      cleanup = () => clearTimeout(t);
      pauseVideoEl = null;
      pauseAdvanceFn = advance;
      pauseDurationMs = duration;
    } else if (slide.type === 'video') {
      nextEl.innerHTML = '';
      const v = document.createElement('video');
      v.className = 'slide-media';
      v.src = slide.url;
      v.muted = true;
      v.autoplay = true;
      v.playsInline = true;
      v.addEventListener('ended', advance);
      v.addEventListener('error', advance);
      const guard = setTimeout(advance, 120_000); // sécurité 2 min max
      cleanup = () => { clearTimeout(guard); v.pause(); };
      nextEl.appendChild(v);
      pauseVideoEl = v;
      pauseAdvanceFn = advance;
      pauseDurationMs = null;
    } else {
      nextEl.innerHTML = '';
      const el = document.createElement('img');
      el.className = 'slide-media';
      el.src = slide.url;
      el.onerror = advance;
      nextEl.appendChild(el);
      const duration = settings.delay * 1000;
      const t = setTimeout(advance, duration);
      cleanup = () => clearTimeout(t);
      pauseVideoEl = null;
      pauseAdvanceFn = advance;
      pauseDurationMs = duration;
    }

    // Crossfade -- annule d'abord un éventuel retrait d'opacité déjà
    // programmé pour `nextEl` (voir fadeOutTimers ci-dessus) : sinon, si cet
    // élément redevient actif moins de 800ms après en être sorti, ce
    // minuteur périmé l'efface juste après l'avoir montré.
    requestAnimationFrame(() => {
      if (fadeOutTimers[next]) { clearTimeout(fadeOutTimers[next]); fadeOutTimers[next] = null; }
      nextEl.classList.add('active');
      fadeOutTimers[curKey] = setTimeout(() => {
        curEl.classList.remove('active');
        fadeOutTimers[curKey] = null;
      }, 800);
    });
    current = next;

    const badge = document.getElementById('slideBadge');
    if (badge) badge.classList.toggle('hidden', slide.source !== 'guest');

    const idBadge = document.getElementById('slideMediaId');
    if (idBadge) {
      if (showMediaId && slide.media_uid) {
        idBadge.textContent = '#' + slide.media_uid;
        idBadge.classList.remove('hidden');
      } else {
        idBadge.classList.add('hidden');
      }
    }

    const tagsBox = document.getElementById('slideTags');
    if (tagsBox) {
      const tags = (showTags && Array.isArray(slide.tags)) ? slide.tags : [];
      if (tags.length) {
        const chipStyle = `font-family:${tagsStyle.font};font-size:${tagsStyle.font_size}px;`
          + `background:${tagsStyle.bg_color};color:${tagsStyle.text_color};`;
        tagsBox.innerHTML = tags
          .map((t) => `<span class="slide-tag-chip" style='${chipStyle}'>${escapeHtml(t)}</span>`)
          .join('');
        tagsBox.classList.remove('hidden');
      } else {
        tagsBox.classList.add('hidden');
      }
    }
  }

  // ── Affichage forcé hors cycle ────────────────────────────────────────
  // Affiche `page` immédiatement (coupe court à la slide en cours, quelle
  // qu'elle soit) pendant `remainingMs`, puis appelle endForcedPromo().
  // Construite sur le même squelette que la branche 'promo' de showNext()
  // ci-dessus (fond/texte/QR, effet visuel, crossfade) -- mais HORS de
  // `slides`/`idx` : le cycle normal n'est ni consommé ni avancé pendant ce
  // temps, showNext() reprend exactement où il en était à la fin.
  function showForcedPromo(page, remainingMs) {
    if (cleanup) { cleanup(); cleanup = null; }
    forcedPromoActive = true;
    forcedPromoPageId = page.id;

    const next = current === 'A' ? 'B' : 'A';
    const curKey = current; // capturé avant réaffectation de `current` plus bas (voir Crossfade)
    const curEl  = document.getElementById('slide' + current);
    const nextEl = document.getElementById('slide' + next);
    nextEl.className = `slide slide-promo effect-${page.effect || 'fade'}`;
    buildPromoContent(nextEl, page);

    let called = false;
    const advance = () => { if (!called) { called = true; endForcedPromo(); } };
    const t = setTimeout(advance, Math.max(0, remainingMs));
    cleanup = () => clearTimeout(t);
    pauseVideoEl = null;
    pauseAdvanceFn = advance;
    pauseDurationMs = Math.max(0, remainingMs);

    requestAnimationFrame(() => {
      if (fadeOutTimers[next]) { clearTimeout(fadeOutTimers[next]); fadeOutTimers[next] = null; }
      nextEl.classList.add('active');
      fadeOutTimers[curKey] = setTimeout(() => {
        curEl.classList.remove('active');
        fadeOutTimers[curKey] = null;
      }, 800);
    });
    current = next;

    // Une page promo forcée n'est ni une capture invitée, ni identifiée par
    // un media_uid, ni taguée : masquer les badges de la slide précédente
    // plutôt que de les laisser affichés par erreur pendant l'interruption.
    const badge = document.getElementById('slideBadge');
    if (badge) badge.classList.add('hidden');
    const idBadge = document.getElementById('slideMediaId');
    if (idBadge) idBadge.classList.add('hidden');
    const tagsBox = document.getElementById('slideTags');
    if (tagsBox) tagsBox.classList.add('hidden');
  }

  // Fin naturelle de l'affichage forcé (durée écoulée) : reprend le cycle
  // normal via showNext(), qui reprogramme `cleanup`/pauseAdvanceFn/etc.
  // pour la slide suivante comme d'habitude. N'est appelée QUE si le
  // diaporama n'est pas en pause à cet instant : sinon (voir
  // pauseSlideshow ci-dessus, qui annule ce minuteur comme n'importe quel
  // autre) le minuteur ne peut de toute façon pas se déclencher tant que
  // resumeSlideshow() ne l'a pas reprogrammé -- garde-fou plutôt que cas
  // réellement atteint.
  function endForcedPromo() {
    forcedPromoActive = false;
    forcedPromoPageId = null;
    if (!paused) showNext();
  }

  // ── Pause (voir #pauseBtn) ────────────────────────────────────────────
  const pauseBtn = document.getElementById('pauseBtn');

  function updatePauseUI() {
    if (!pauseBtn) return;
    pauseBtn.textContent = paused ? '►' : '❚❚';
    pauseBtn.classList.toggle('is-paused', paused);
    pauseBtn.setAttribute('aria-label', paused ? 'Reprendre le diaporama' : 'Mettre en pause');
    pauseBtn.title = paused ? 'Reprendre (espace)' : 'Pause (espace)';
    if (paused) pauseBtn.classList.add('visible'); // rester visible tant qu'en pause, sinon impossible à retrouver
  }

  function pauseSlideshow() {
    if (paused || !cleanup) return; // rien à figer avant l'affichage de la 1re slide
    paused = true;
    cleanup(); // annule le minuteur en cours -- pour une vidéo, met aussi en pause sa lecture (voir showNext())
    cleanup = null;
    updatePauseUI();
  }

  function resumeSlideshow() {
    if (!paused) return;
    paused = false;
    if (pauseVideoEl) {
      pauseVideoEl.play().catch(() => {}); // 'ended'/'error' déjà écoutés depuis showNext(), pas à reposer
      const guard = setTimeout(pauseAdvanceFn, 120_000);
      const v = pauseVideoEl;
      cleanup = () => { clearTimeout(guard); v.pause(); };
    } else if (pauseAdvanceFn) {
      const t = setTimeout(pauseAdvanceFn, pauseDurationMs || 5000);
      cleanup = () => clearTimeout(t);
    }
    updatePauseUI();
  }

  // Écrit l'état pause côté serveur (slideshow.paused, voir app.py :
  // api_bestof_set_pause) -- même réglage que le bouton pause du back
  // office (/admin/slideshow → Paramètres), donc les deux se
  // resynchronisent automatiquement entre eux (voir syncRemotePause() et
  // refreshPromoPages() ci-dessous, sondées toutes les 15s). Fire-and-forget
  // : l'effet local est déjà appliqué (pauseSlideshow/resumeSlideshow),
  // un échec réseau ne fait que retarder la resynchronisation du back office.
  function persistPause(newPaused) {
    fetch('/api/bestof/pause', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paused: newPaused }),
    }).catch(() => {});
  }

  // Action LOCALE (clic sur #pauseBtn ou barre espace) : bascule + persiste.
  // À distinguer de syncRemotePause() ci-dessous (sondage), qui applique un
  // changement déjà décidé ailleurs SANS le repersister (pour ne pas
  // boucler inutilement les deux sur un aller-retour réseau).
  function togglePause() {
    paused ? resumeSlideshow() : pauseSlideshow();
    persistPause(paused);
  }

  // Applique un état pause décidé À DISTANCE (back office, voir
  // admin_slideshow_toggle_pause, app.py) dès qu'il diffère de l'état
  // local -- lu depuis /api/bestof/promo-pages (sondage rapide, 15s) et
  // /api/bestof/slides (rafraîchissement complet). N'écrit jamais côté
  // serveur (voir togglePause() ci-dessus pour la version qui persiste).
  function syncRemotePause(remotePaused) {
    if (typeof remotePaused !== 'boolean' || remotePaused === paused) return;
    if (remotePaused) pauseSlideshow(); else resumeSlideshow();
  }

  // Applique un affichage forcé décidé À DISTANCE (back office, voir
  // admin_promo_force_start/admin_promo_force_stop, app.py) -- lu depuis
  // /api/bestof/promo-pages (sondage rapide, 15s) et /api/bestof/slides,
  // `remote` étant `forced_promo` de ces réponses : null (inactif) ou
  // {page, remaining_ms}. Ignore les sondages "rien de nouveau" (même page
  // déjà affichée localement) pour ne pas relancer/interrompre le minuteur
  // en cours à chaque sondage -- seule une VRAIE transition (démarrage,
  // changement de page, ou annulation) déclenche quelque chose ici.
  function syncForcedPromo(remote) {
    const remoteId = remote && remote.page ? remote.page.id : null;
    if (remoteId === forcedPromoPageId) return;
    if (remoteId != null) {
      showForcedPromo(remote.page, remote.remaining_ms);
    } else if (forcedPromoActive) {
      // Désactivé côté back office avant la fin normale (bouton
      // "Désactiver") : reprend le cycle normal tout de suite, comme une
      // fin de durée naturelle.
      forcedPromoActive = false;
      forcedPromoPageId = null;
      if (cleanup) { cleanup(); cleanup = null; }
      if (!paused) showNext();
    }
  }

  if (pauseBtn) pauseBtn.addEventListener('click', togglePause);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      togglePause();
    }
  });

  // Bouton masqué par défaut (voir #pauseBtn, CSS) : réapparaît au moindre
  // geste (souris déplacée, écran tactile touché) puis se refond après
  // quelques secondes d'inactivité -- sauf en pause, où il doit rester
  // trouvable pour reprendre la lecture (voir updatePauseUI() ci-dessus).
  let hideControlsTimer = null;
  function showControls() {
    if (!pauseBtn) return;
    pauseBtn.classList.add('visible');
    clearTimeout(hideControlsTimer);
    hideControlsTimer = setTimeout(() => {
      if (!paused) pauseBtn.classList.remove('visible');
    }, 3000);
  }
  window.addEventListener('mousemove', showControls, { passive: true });
  window.addEventListener('touchstart', showControls, { passive: true });
  showControls();

  let lastData = null; // dernières captures/images reçues, réutilisées pour reconstruire
                        // la liste sans re-fetch quand seules les pages promo sont rafraîchies

  async function fetchSlides() {
    const res = await fetch('/api/bestof/slides');
    return res.json();
  }

  // Applique une nouvelle liste de slides sans interrompre le slide en cours.
  function applySlides(newSlides) {
    if (!newSlides.length) return; // garder la liste actuelle si vide
    slides = newSlides;
    idx = idx % slides.length;
    if (document.getElementById('empty').style.display !== 'none') {
      document.getElementById('empty').style.display = 'none';
      showNext();
    }
  }

  async function refreshSlides() {
    try {
      const data = await fetchSlides();
      lastData = data;
      promoPages = data.promo_pages || promoPages;
      showMediaId = !!data.show_media_id;
      showTags = !!data.show_tags;
      tagsStyle = data.tags_style || tagsStyle;
      settings.delay = data.delay || 5;
      settings.order = data.order || settings.order;
      applySlides(buildSlides(data));
      syncRemotePause(data.paused);
      syncForcedPromo(data.forced_promo);
    } catch (e) {
      console.warn('slideshow refresh échoué', e);
    }
  }

  // Les pages promo (fond/texte/QR/fréquence/pause/effet) sont interrogées à
  // cadence fixe et rapide, indépendamment de slideshow.refresh_interval (qui
  // ne cadence que le rafraîchissement complet — captures, images
  // intermédiaires — et peut être lent, voire désactivé) : un changement fait
  // dans /admin/slideshow → Pages promo s'applique donc toujours en quelques
  // secondes, sans devoir recharger la page ni attendre le rafraîchissement
  // complet.
  async function refreshPromoPages() {
    try {
      const res = await fetch('/api/bestof/promo-pages');
      const data = await res.json();
      promoPages = data.pages || [];
      if (lastData) applySlides(buildSlides(lastData));
      syncRemotePause(data.paused);
      syncForcedPromo(data.forced_promo);
    } catch (e) { /* on garde les réglages actuels */ }
  }
  setInterval(refreshPromoPages, 15000);

  try {
    const data = await fetchSlides();
    lastData = data;
    settings = {
      delay:           data.delay || 5,
      order:           data.order || 'chrono',
      refreshInterval: data.refresh_interval ?? 300,
    };
    promoPages = data.promo_pages || [];
    showMediaId = !!data.show_media_id;
    showTags = !!data.show_tags;
    tagsStyle = data.tags_style || tagsStyle;
    slides = buildSlides(data);
    if (!slides.length) {
      document.getElementById('empty').style.display = 'flex';
    } else {
      showNext();
      // Affichage forcé et/ou pause déjà actifs depuis le back office avant
      // même l'ouverture du kiosque (voir slideshow.forced_promo_*/paused,
      // app.py) : appliqués ici dans cet ordre -- la page forcée remplace
      // la 1re slide normale si besoin, la pause fige ensuite sur ce qui
      // est effectivement affiché (forcé ou non) -- plutôt que de démarrer
      // la lecture contre la volonté de l'admin le temps du 1er sondage (15s).
      syncForcedPromo(data.forced_promo);
      if (data.paused) pauseSlideshow();
      if (settings.refreshInterval > 0) {
        setInterval(refreshSlides, settings.refreshInterval * 1000);
      }
    }
  } catch (e) {
    document.getElementById('empty').style.display = 'flex';
    document.getElementById('empty').textContent = 'Erreur de chargement.';
  }
})();
</script>
</body>
</html>
