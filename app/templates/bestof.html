<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Of — {{ config.get('ui', {}).get('app_title', 'Pictotem') }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #slideshow { position: relative; width: 100%; height: 100%; }
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.8s ease;
    }
    .slide.active { opacity: 1; }
    /* Classe explicite (plutôt qu'un sélecteur .slide img/video global) pour
       ne cibler que les vraies photos/vidéos — sinon cette règle, plus
       spécifique que .promo-bg/.promo-qr-card img, les écrase aussi et casse
       la mise en page de la slide promo (voir buildPromoContent ci-dessous). */
    .slide-media { width: 100%; height: 100%; object-fit: contain; display: block; }
    video.slide-media { background: #000; }
    #empty {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      color: #555; font-family: sans-serif; font-size: 18px;
    }
    /* Picto "Invité" : signale une photo envoyée par un visiteur (non
       officielle), coin bas-gauche, ne recouvre jamais le média. */
    #slideBadge {
      position: absolute; bottom: 24px; left: 24px; z-index: 5;
      background: rgba(0,0,0,.6); color: #fff; font-family: sans-serif;
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; padding: 6px 14px; border-radius: 999px;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,.15);
    }
    #slideBadge.hidden { display: none; }

    /* Slide promo (fond + QR + texte) — voir /admin/slideshow */
    .slide.slide-promo { display: block; }
    .promo-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    .promo-bg-fallback {
      position: absolute; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #0d8b8f 0%, #145b5e 55%, #111315 100%);
    }
    .promo-overlay { position: absolute; inset: 0; z-index: 1; background: rgba(0,0,0,.42); }
    /* Doit rester au-dessus de .promo-overlay (texte + QR toujours visibles,
       jamais recouverts par le voile d'assombrissement du fond). */
    .promo-content {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 36px; text-align: center; padding: 60px; box-sizing: border-box;
    }
    .promo-text { max-width: 900px; }
    .promo-text p {
      margin: 0 0 16px; line-height: 1.4;
      text-shadow: 0 2px 14px rgba(0,0,0,.65);
    }
    .promo-text p:last-child { margin-bottom: 0; }
    .promo-qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .promo-qr-card {
      background: #fff; padding: 16px; border-radius: 20px;
      box-shadow: 0 14px 44px rgba(0,0,0,.45); line-height: 0;
    }
    .promo-qr-card img { display: block; }
    .promo-qr-caption {
      font-family: system-ui, sans-serif; font-size: 16px; color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
    }
  </style>
</head>
<body>
<div id="slideshow">
  <div id="slideA" class="slide"></div>
  <div id="slideB" class="slide"></div>
  <div id="slideBadge" class="hidden">Invité</div>
  <div id="empty" style="display:none">Aucun média à afficher.</div>
</div>

<script>
(async () => {
  let slides = [];
  let idx = 0;
  let current = 'A';
  let settings = { delay: 5, order: 'chrono', refreshInterval: 300 };
  let promoCfg = { enabled: false, frequency: 6 };
  let cleanup = null;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function interleave(captures, images) {
    if (!images.length) return [...captures];
    if (!captures.length) return [...images];
    const result = [];
    const step = Math.max(1, Math.floor(captures.length / (images.length + 1)));
    let ii = 0;
    captures.forEach((c, i) => {
      result.push(c);
      if ((i + 1) % step === 0 && ii < images.length) result.push(images[ii++]);
    });
    while (ii < images.length) result.push(images[ii++]);
    return result;
  }

  // Insère une slide promo toutes les N slides "réelles" (photos/vidéos/images
  // intermédiaires), sans compter les slides promo elles-mêmes.
  function insertPromo(base) {
    if (!promoCfg.enabled || !promoCfg.frequency) return base;
    const result = [];
    base.forEach((s, i) => {
      result.push(s);
      if ((i + 1) % promoCfg.frequency === 0) result.push({ type: 'promo' });
    });
    return result;
  }

  function buildSlides(data) {
    let base;
    if (data.order === 'random') {
      base = [...data.captures, ...data.slideshow_images];
      shuffle(base);
    } else {
      // chrono, votes_desc, votes_asc : captures déjà triées côté serveur
      base = interleave(data.captures, data.slideshow_images);
    }
    const withPromo = insertPromo(base);
    // Aucun média, mais page promo activée : on la diffuse seule en boucle
    // plutôt que d'afficher "Aucun média à afficher.".
    if (!withPromo.length && promoCfg.enabled) return [{ type: 'promo' }];
    return withPromo;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function buildPromoContent(el) {
    el.innerHTML = '';
    const bg = promoCfg.background_url
      ? `<img class="promo-bg" src="${escapeHtml(promoCfg.background_url)}" alt="">`
      : `<div class="promo-bg-fallback"></div>`;
    const textHtml = (promoCfg.text || '')
      .split('\n')
      .filter((line) => line.trim() !== '')
      .map((line) => `<p>${escapeHtml(line)}</p>`)
      .join('');
    const textStyle = `font-family:${promoCfg.text_font || 'system-ui, sans-serif'};`
      + `font-size:${promoCfg.text_size || 28}px;color:${promoCfg.text_color || '#ffffff'};`;
    el.innerHTML = `
      ${bg}
      <div class="promo-overlay"></div>
      <div class="promo-content">
        <div class="promo-text" style='${textStyle}'>${textHtml}</div>
        <div class="promo-qr-wrap">
          <div class="promo-qr-card">
            <img src="${escapeHtml(promoCfg.qr_url)}" width="${promoCfg.qr_size || 220}" height="${promoCfg.qr_size || 220}" alt="QR code galerie">
          </div>
          <div class="promo-qr-caption">Scannez pour voir &amp; voter</div>
        </div>
      </div>
    `;
  }

  function showNext() {
    if (!slides.length) return;
    if (cleanup) { cleanup(); cleanup = null; }

    const slide = slides[idx];
    idx++;
    if (idx >= slides.length) {
      idx = 0;
      if (settings.order === 'random') shuffle(slides);
    }

    const next = current === 'A' ? 'B' : 'A';
    const curEl  = document.getElementById('slide' + current);
    const nextEl = document.getElementById('slide' + next);

    nextEl.className = 'slide' + (slide.type === 'promo' ? ' slide-promo' : '');

    let called = false;
    const advance = () => { if (!called) { called = true; showNext(); } };

    if (slide.type === 'promo') {
      buildPromoContent(nextEl);
      const t = setTimeout(advance, settings.delay * 1000);
      cleanup = () => clearTimeout(t);
    } else if (slide.type === 'video') {
      nextEl.innerHTML = '';
      const v = document.createElement('video');
      v.className = 'slide-media';
      v.src = slide.url;
      v.muted = true;
      v.autoplay = true;
      v.playsInline = true;
      v.addEventListener('ended', advance);
      v.addEventListener('error', advance);
      const guard = setTimeout(advance, 120_000); // sécurité 2 min max
      cleanup = () => { clearTimeout(guard); v.pause(); };
      nextEl.appendChild(v);
    } else {
      nextEl.innerHTML = '';
      const el = document.createElement('img');
      el.className = 'slide-media';
      el.src = slide.url;
      el.onerror = advance;
      nextEl.appendChild(el);
      const t = setTimeout(advance, settings.delay * 1000);
      cleanup = () => clearTimeout(t);
    }

    // Crossfade
    requestAnimationFrame(() => {
      nextEl.classList.add('active');
      setTimeout(() => curEl.classList.remove('active'), 800);
    });
    current = next;

    const badge = document.getElementById('slideBadge');
    if (badge) badge.classList.toggle('hidden', slide.source !== 'guest');
  }

  let lastData = null; // dernières captures/images reçues, réutilisées pour reconstruire
                        // la liste sans re-fetch quand seule la promo est rafraîchie

  async function fetchSlides() {
    const res = await fetch('/api/bestof/slides');
    return res.json();
  }

  // Applique une nouvelle liste de slides sans interrompre le slide en cours.
  function applySlides(newSlides) {
    if (!newSlides.length) return; // garder la liste actuelle si vide
    slides = newSlides;
    idx = idx % slides.length;
    if (document.getElementById('empty').style.display !== 'none') {
      document.getElementById('empty').style.display = 'none';
      showNext();
    }
  }

  async function refreshSlides() {
    try {
      const data = await fetchSlides();
      lastData = data;
      promoCfg = data.promo || promoCfg;
      settings.delay = data.delay || 5;
      settings.order = data.order || settings.order;
      applySlides(buildSlides(data));
    } catch (e) {
      console.warn('slideshow refresh échoué', e);
    }
  }

  // La page promo (fond/texte/QR/fréquence) est interrogée à cadence fixe et
  // rapide, indépendamment de slideshow.refresh_interval (qui ne cadence que
  // le rafraîchissement complet — captures, images intermédiaires — et peut
  // être lent, voire désactivé) : un changement dans /admin/slideshow →
  // Page promo s'applique donc toujours en quelques secondes, sans devoir
  // recharger la page ni attendre le refresh complet.
  async function refreshPromoSettings() {
    try {
      const res = await fetch('/api/bestof/promo-settings');
      promoCfg = await res.json();
      if (lastData) applySlides(buildSlides(lastData));
    } catch (e) { /* on garde les réglages actuels */ }
  }
  setInterval(refreshPromoSettings, 15000);

  try {
    const data = await fetchSlides();
    lastData = data;
    settings = {
      delay:           data.delay || 5,
      order:           data.order || 'chrono',
      refreshInterval: data.refresh_interval ?? 300,
    };
    promoCfg = data.promo || promoCfg;
    slides = buildSlides(data);
    if (!slides.length) {
      document.getElementById('empty').style.display = 'flex';
    } else {
      showNext();
      if (settings.refreshInterval > 0) {
        setInterval(refreshSlides, settings.refreshInterval * 1000);
      }
    }
  } catch (e) {
    document.getElementById('empty').style.display = 'flex';
    document.getElementById('empty').textContent = 'Erreur de chargement.';
  }
})();
</script>
</body>
</html>
