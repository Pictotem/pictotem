<!-- Page promo — URL dédiée hors diaporama (voir /pages/<slug>, app.py) --
     rendu entièrement côté serveur à partir de _promo_page_public(), même
     structure visuelle que la slide promo de bestof.html (buildPromoContent,
     voir static/promo-editor.js pour la production du contenu WYSIWYG) mais
     SANS rotation ni minuteur JS : cette page reste affichée telle quelle,
     un rendu statique suffit. html_content est déjà nettoyé à l'écriture
     (sanitize_promo_html, utils.py) et déjà résolu (placeholders {ip}/{port},
     QR codes {qrcode=...}) par _promo_page_public() -- donc réutilisable ici
     avec |safe, comme bestof.html le fait via innerHTML côté client. -->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ config.get('ui', {}).get('app_title', 'Pictotem') }}</title>
  <link rel="stylesheet" href="{{ url_for('custom_fonts_css') }}">
  <!-- Styles de contenu CKEditor 5 (tableaux/images/légendes), voir
       bestof.html -- même feuille, même raison. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='ckeditor5/ckeditor5-content.css') }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; background: #000; }

    .promo-page {
      position: relative; width: 100%; min-height: 100vh; overflow: hidden;
      background-color: {{ page.background_bg_color or '#14161a' }};
    }
    .promo-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }
    .promo-overlay { position: absolute; inset: 0; z-index: 1; background: rgba(0,0,0,.42); }
    .promo-content {
      position: relative; z-index: 3; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 36px; text-align: center; box-sizing: border-box;
      padding: {{ page.content_padding_top }}px {{ page.content_padding_right }}px
                {{ page.content_padding_bottom }}px {{ page.content_padding_left }}px;
    }
    /* Mêmes règles que .promo-text dans bestof.html (voir ce fichier pour
       le détail des commentaires) -- dupliquées ici plutôt que partagées
       via un fichier CSS commun, pour garder cette page totalement
       autonome (aucune dépendance à bestof.html). */
    .promo-text { max-width: 900px; font-family: system-ui, "Segoe UI", sans-serif; font-size: 28px; color: #ffffff; }
    .promo-text p { margin: 0 0 16px; line-height: 1.4; }
    .promo-text p:last-child { margin-bottom: 0; }
    .promo-text ul, .promo-text ol { text-align: left; display: inline-block; margin: 0 0 16px; }
    .promo-text.ck-content table.table:not(.layout-table),
    .promo-text.ck-content figure.table:not(.layout-table) > table,
    .promo-text.ck-content table.table:not(.layout-table) > * > tr > td,
    .promo-text.ck-content table.table:not(.layout-table) > * > tr > th {
      border: none; background: transparent;
    }
    .promo-text table { border-collapse: collapse; margin: 0 auto 16px; }
    .promo-text td, .promo-text th { padding: 6px 10px; white-space: pre-wrap; }
    .promo-inline-qr { background: #fff; padding: 8px; border-radius: 12px; box-shadow: 0 8px 26px rgba(0,0,0,.4); }

    /* Effet visuel à l'apparition (voir /admin/slideshow -> Pages promo)
       -- rejoué une seule fois au chargement de la page, pas de boucle
       (contrairement au kenburns dans bestof.html, cadencé sur le temps de
       pause de la slide en rotation : ici il n'y a pas de "temps de pause",
       la page reste affichée indéfiniment, donc une durée fixe suffit). */
    @keyframes promoSlideUp { from { transform: translateY(46px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes promoZoomIn  { from { transform: scale(.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes promoBounce  { 0% { transform: translateY(-34px); opacity: 0; } 60% { transform: translateY(10px); opacity: 1; } 100% { transform: translateY(0); } }
    @keyframes promoKenburns { from { transform: scale(1); } to { transform: scale(1.09); } }
    .effect-slide-up .promo-content { animation: promoSlideUp .7s ease both; }
    .effect-zoom-in .promo-content { animation: promoZoomIn .7s ease both; }
    .effect-bounce .promo-content { animation: promoBounce .9s ease both; }
    .effect-kenburns .promo-bg { animation: promoKenburns 14s ease-in-out both; }
  </style>
</head>
<body>
  <div class="promo-page effect-{{ page.effect or 'fade' }}">
    {% if page.background_kind == 'gradient' and page.background_color1 %}
    <div class="promo-bg" style="background:linear-gradient({{ page.background_angle or 135 }}deg, {{ page.background_color1 }}, {{ page.background_color2 or page.background_color1 }})"></div>
    {% elif page.background_url %}
    <img class="promo-bg" src="{{ page.background_url }}" alt="">
    {% endif %}
    {% if page.overlay_enabled %}
    <div class="promo-overlay"></div>
    {% endif %}
    <div class="promo-content">
      <div class="promo-text ck-content">{{ page.html_content | safe }}</div>
    </div>
  </div>
  {% if page.custom_css %}
  <script>
    // Même précaution que buildPromoContent() dans bestof.html : injecté via
    // .textContent (jamais concaténé dans du HTML), pour qu'aucune séquence
    // "</script"/"</style" saisie dans le CSS libre de l'admin ne puisse
    // casser hors de la balise et injecter du HTML/JS arbitraire sur cette
    // page publique. {{ page.custom_css | tojson }} (Jinja) échappe déjà
    // correctement la valeur pour un contexte <script>.
    (() => {
      const styleEl = document.createElement('style');
      styleEl.textContent = '@scope {\n' + {{ page.custom_css | tojson }} + '\n}';
      document.head.appendChild(styleEl);
    })();
  </script>
  {% endif %}
</body>
</html>
